services:
  - type: web
    name: usta-admisiones-whatsapp
    runtime: docker
    plan: starter
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usta-admisiones-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: COHERE_EMBED_MODEL
        value: embed-v4.0
      - key: COHERE_EMBED_DIM
        value: "1536"
      - key: COHERE_RERANK_MODEL
        value: rerank-v4.0-fast

databases:
  - name: usta-admisiones-db
    databaseName: admissions
    user: admissions
    postgresMajorVersion: "16"
    plan: 0.1c-256mb
    ipAllowList: []

